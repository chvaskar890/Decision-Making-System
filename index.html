<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Criteria Decision-Making System</title>
    <!-- Google Fonts for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Link to the external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Preloader overlay to show when processing calculations -->
    <div class="preloader-overlay" id="preloader">
        <div class="loader-circle"></div>
    </div>

    <!-- Main application container -->
    <div class="app-container">
        <!-- Sidebar for navigation and progress -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">MCDM System</div>
            <ul class="progress-stepper" id="progress-stepper">
                <!-- Progress steps will be generated by JavaScript -->
            </ul>
            <div class="sidebar-footer">
                <p>© 2024 GEC Mech. Students</p>
                <!-- The theme switcher has been removed from here -->
            </div>
        </aside>

        <!-- Main content area where wizard steps are displayed -->
        <main id="wizard-container">
            <!-- Wizard steps will be dynamically generated by JavaScript -->
        </main>
    </div>

    <!-- Link to the external JavaScript file. 'defer' ensures it runs after the HTML is parsed. -->
    <script src="script.js" defer></script>
</body>
</html>
